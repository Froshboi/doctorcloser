<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DoctorCloser — Book a doctor in Nigeria, today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F0E7; --surface:#FFFDF8; --ink:#16241C; --ink-soft:#5B675F; --ink-faint:#8A9089;
  --green:#1F5C4A; --green-deep:#123C30; --orange:#C85A24; --mint:#DCEBE2;
  --line:#DDD4C0; --line-soft:#E9E2D2; --focus:#123C30; --r-s:4px; --r-m:8px;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101B16; --surface:#16241D; --ink:#ECE8DD; --ink-soft:#9FAAA2; --ink-faint:#6D786F;
    --green:#5FBE97; --green-deep:#DCEEE5; --orange:#E2854E; --mint:#1B3229;
    --line:#2B382F; --line-soft:#202B24; --focus:#5FBE97;
  }
}
:root[data-theme="dark"]{
  --bg:#101B16; --surface:#16241D; --ink:#ECE8DD; --ink-soft:#9FAAA2; --ink-faint:#6D786F;
  --green:#5FBE97; --green-deep:#DCEEE5; --orange:#E2854E; --mint:#1B3229;
  --line:#2B382F; --line-soft:#202B24; --focus:#5FBE97;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;margin:0;letter-spacing:-0.01em;}
button,input,select{font-family:inherit;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px;}

/* ---- Nav ---- */
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--bg);border-bottom:1px solid var(--line);}
.nav-inner{max-width:1160px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;}
.logo{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.1rem;white-space:nowrap;cursor:pointer;flex:none;}
.logo .c2{color:var(--orange);}
nav.links{display:flex;gap:24px;font-size:0.9rem;font-weight:500;}
nav.links a{text-decoration:none;color:var(--ink-soft);cursor:pointer;padding:4px 0;border-bottom:2px solid transparent;}
nav.links a:hover,nav.links a.active{color:var(--ink);}
nav.links a.active{border-bottom-color:var(--orange);}
.nav-actions{margin-left:auto;display:flex;gap:8px;flex:none;}
.menu-toggle{display:none;width:38px;height:38px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);color:var(--ink);cursor:pointer;flex:none;}
.mobile-menu{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:0;right:0;background:var(--surface);border-bottom:1px solid var(--line);z-index:55;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:2px;box-shadow:0 12px 20px rgba(10,20,15,0.08);}
.mobile-menu.open{display:flex;}
.mobile-menu a.mlink{padding:12px 4px;font-size:0.96rem;font-weight:500;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line-soft);cursor:pointer;}
.mobile-menu a.mlink:last-of-type{border-bottom:none;}
.mobile-menu .mauth{display:flex;gap:8px;margin-top:12px;}
.mobile-menu .mauth .btn{flex:1;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:0.86rem;
  padding:9px 16px;border-radius:var(--r-s);border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1;white-space:nowrap;}
.btn-ghost{color:var(--ink);background:transparent;border-color:var(--line);}
.btn-ghost:hover{background:var(--line-soft);}
.btn-solid{background:var(--green);color:var(--surface);}
.btn-solid:hover{background:var(--green-deep);}
:root[data-theme="dark"] .btn-solid:hover{background:#4FA985;}
.btn-solid:disabled{opacity:.6;cursor:default;}
.btn-block{width:100%;padding:12px;}
.btn-sm{padding:6px 10px;font-size:0.8rem;}

main{min-height:60vh;}

/* ---- Landing: hero ---- */
.hero{padding:64px 0 56px;border-bottom:1px solid var(--line);}
.hero-grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:52px;align-items:center;}
h1.hero-h{font-size:clamp(2.1rem,4.2vw,3.1rem);line-height:1.08;font-weight:700;max-width:15ch;}
h1.hero-h .accent{color:var(--orange);}
.hero-sub{margin-top:18px;font-size:1.05rem;color:var(--ink-soft);max-width:44ch;}
.hero-search{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:8px;display:flex;gap:6px;}
.hero-search .field{flex:1;display:flex;align-items:center;gap:8px;padding:9px 12px;min-width:0;}
.hero-search .field+.field{border-left:1px solid var(--line);}
.hero-search input{border:none;background:transparent;color:var(--ink);font-size:0.94rem;width:100%;min-width:0;}
.hero-search input:focus{outline:none;}
.hero-search svg{flex:none;color:var(--ink-faint);}
.hero-search button{border:none;background:var(--orange);color:#fff;border-radius:var(--r-s);padding:0 20px;font-weight:600;font-size:0.92rem;cursor:pointer;flex:none;}
.hero-chips{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;}
.chip{font-size:0.82rem;font-weight:500;padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
.chip:hover{border-color:var(--ink-faint);}
.chip[aria-pressed="true"]{background:var(--mint);border-color:var(--green);color:var(--green-deep);font-weight:600;}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:var(--green);}

.hero-visual{background:var(--green);border-radius:14px;padding:22px;min-height:340px;position:relative;overflow:hidden;}
:root[data-theme="dark"] .hero-visual{background:#0D1D17;}
.hero-visual svg{width:100%;height:auto;display:block;}
.hero-visual .cap{position:absolute;left:22px;bottom:18px;color:#FBF8F1;font-size:0.8rem;opacity:.9;}

/* ---- Trust bar ---- */
.trust{padding:26px 0;border-bottom:1px solid var(--line);}
.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.trust-stat .num{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;}
.trust-stat .label{font-size:0.8rem;color:var(--ink-soft);margin-top:2px;}

/* ---- generic section ---- */
section.block{padding:64px 0;border-bottom:1px solid var(--line);}
section.block:last-of-type{border-bottom:none;}
.section-head{margin-bottom:32px;}
.section-head h2{font-size:clamp(1.4rem,2.6vw,1.9rem);max-width:24ch;}
.section-head p{color:var(--ink-soft);margin-top:8px;max-width:48ch;}

.steps{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);}
.step{padding:24px 22px 24px 0;border-right:1px solid var(--line);}
.step:last-child{border-right:none;padding-right:0;}
.step:not(:first-child){padding-left:22px;}
.step .n{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--orange);font-size:0.92rem;}
.step h3{margin-top:10px;font-size:1.08rem;}
.step p{color:var(--ink-soft);margin-top:6px;font-size:0.92rem;}

.specialty-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
.specialty{background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:8px;min-height:104px;justify-content:space-between;cursor:pointer;}
.specialty:hover{background:var(--line-soft);}
.specialty .icon{color:var(--green);}
.specialty .name{font-weight:600;font-size:0.95rem;}
.specialty .count{font-size:0.78rem;color:var(--ink-soft);}

.cta-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:36px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.cta-panel h3{font-size:1.2rem;}
.cta-panel p{color:var(--ink-soft);margin-top:6px;max-width:40ch;}

/* ---- Search page ---- */
.filterbar{border-bottom:1px solid var(--line);background:var(--bg);}
.filterbar-inner{max-width:1160px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;}
.filterbar-inner::-webkit-scrollbar{display:none;}
.filter-sep{width:1px;height:20px;background:var(--line);flex:none;margin:0 4px;}
.sort-select{margin-left:auto;flex:none;font-size:0.82rem;font-weight:500;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 10px;}
.search-content{max-width:1160px;margin:0 auto;padding:20px 24px 60px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;}
.results-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
.results-head h1{font-size:1.05rem;font-weight:600;}
.results-head span{font-size:0.82rem;color:var(--ink-faint);}
.doctor-list{display:flex;flex-direction:column;gap:10px;}
.doctor-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:start;}
.avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1rem;color:#fff;flex:none;}
.doc-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.doc-name{font-size:1rem;font-weight:600;cursor:pointer;}
.doc-name:hover{color:var(--green);}
.verified{display:inline-flex;align-items:center;gap:3px;font-size:0.7rem;font-weight:600;color:var(--green);background:var(--mint);padding:2px 7px;border-radius:10px;}
.doc-specialty{font-size:0.87rem;color:var(--ink-soft);margin-top:2px;}
.doc-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:0.8rem;color:var(--ink-faint);}
.doc-meta span{display:flex;align-items:center;gap:4px;}
.doc-tags{font-size:0.76rem;color:var(--green);margin-top:4px;font-weight:500;}
.curated-block{margin-bottom:22px;}
.curated-title{font-size:0.95rem;font-weight:600;margin-bottom:10px;}
.curated-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
.curated-row::-webkit-scrollbar{display:none;}
.curated-row .doctor-card{min-width:290px;flex:none;}
.doc-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none;}
.doc-price{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:0.96rem;}
.doc-price small{font-family:'Inter',sans-serif;font-weight:400;color:var(--ink-faint);font-size:0.7rem;}
.next-slot{font-size:0.75rem;color:var(--green);font-weight:600;}
.book-panel{grid-column:1/-1;display:none;border-top:1px solid var(--line);margin-top:12px;padding-top:14px;}
.book-panel.open{display:block;}
.date-row{display:flex;gap:8px;overflow-x:auto;}
.date-pill{flex:none;min-width:54px;text-align:center;padding:8px 6px;border:1px solid var(--line);border-radius:var(--r-s);cursor:pointer;background:var(--surface);}
.date-pill .dow{font-size:0.66rem;color:var(--ink-faint);text-transform:uppercase;}
.date-pill .dnum{font-weight:700;font-size:0.9rem;margin-top:2px;}
.date-pill[aria-pressed="true"]{border-color:var(--green);background:var(--mint);}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:12px;}
.slot-btn{padding:8px 6px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);font-size:0.8rem;font-weight:500;cursor:pointer;color:var(--ink);}
.slot-btn[aria-pressed="true"]{background:var(--green);color:var(--surface);border-color:var(--green);}
.book-confirm-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:12px;flex-wrap:wrap;}
.book-status{font-size:0.8rem;color:var(--ink-soft);}
.book-status.confirmed{color:var(--green);font-weight:600;}
.sidebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);display:flex;flex-direction:column;gap:14px;}
.map-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;overflow:hidden;}
.map-box svg{width:100%;height:auto;display:block;border-radius:var(--r-s);}
.info-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;}
.info-box h3{font-size:0.9rem;margin-bottom:8px;}
.info-box p{font-size:0.84rem;color:var(--ink-soft);margin:0 0 12px;}

/* ---- Doctor profile ---- */
.profile-wrap{max-width:840px;margin:0 auto;padding:36px 24px 60px;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:0.86rem;color:var(--ink-soft);cursor:pointer;margin-bottom:20px;text-decoration:none;}
.back-link:hover{color:var(--ink);}
.profile-head{display:flex;gap:18px;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--line);}
.profile-head .avatar{width:76px;height:76px;font-size:1.4rem;}
.profile-head h1{font-size:1.4rem;}
.profile-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:0.86rem;color:var(--ink-soft);}
.profile-body{padding:28px 0;border-bottom:1px solid var(--line);}
.profile-body h3{font-size:1rem;margin-bottom:10px;}
.profile-body p{color:var(--ink-soft);font-size:0.94rem;max-width:60ch;}

/* ---- Auth pages ---- */
.auth-wrap{max-width:400px;margin:0 auto;padding:60px 24px 80px;}
.auth-wrap h1{font-size:1.5rem;margin-bottom:6px;}
.auth-wrap>p.sub{color:var(--ink-soft);font-size:0.92rem;margin-bottom:26px;}
.field-group{margin-bottom:16px;}
.field-group label{display:block;font-size:0.8rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field-group input{width:100%;padding:11px 12px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:0.94rem;}
.field-group input:focus{outline:none;border-color:var(--green);}
.auth-switch{margin-top:18px;text-align:center;font-size:0.86rem;color:var(--ink-soft);}
.auth-switch a{color:var(--green);font-weight:600;cursor:pointer;text-decoration:none;}

/* ---- Clinics page ---- */
.clinics-hero{padding:56px 0;border-bottom:1px solid var(--line);}
.clinics-hero h1{font-size:clamp(1.8rem,3.6vw,2.5rem);max-width:16ch;}
.clinics-hero p{color:var(--ink-soft);margin-top:14px;max-width:50ch;font-size:1.02rem;}
.benefit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:28px;}
.benefit{background:var(--surface);padding:22px;}
.benefit h3{font-size:1rem;margin-bottom:6px;}
.benefit p{font-size:0.88rem;color:var(--ink-soft);}

/* ---- 404 ---- */
.notfound{text-align:center;padding:100px 24px;}
.notfound h1{font-size:2.2rem;}
.notfound p{color:var(--ink-soft);margin-top:10px;}

/* ---- Footer ---- */
footer{border-top:1px solid var(--line);padding:22px 0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));}
.footer-inner{max-width:1160px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:0.8rem;color:var(--ink-faint);}
.footer-links{display:flex;gap:16px;flex-wrap:wrap;}
.footer-links a{color:var(--ink-faint);text-decoration:none;cursor:pointer;}
.footer-links a:hover{color:var(--ink);}
.built-by strong{color:var(--ink-soft);font-weight:600;}

/* ---- Mobile ---- */
@media (max-width:900px){
  .search-content{grid-template-columns:1fr;}
  .sidebar{position:static;order:-1;}
  .map-box{display:none;}
  .hero-grid{grid-template-columns:1fr;}
  .hero-visual{order:-1;min-height:200px;}
  .trust-grid{grid-template-columns:repeat(2,1fr);row-gap:16px;}
  .steps{grid-template-columns:1fr;}
  .step{border-right:none;border-bottom:1px solid var(--line);padding:20px 0 !important;}
  .step:last-child{border-bottom:none;}
  .specialty-grid{grid-template-columns:repeat(2,1fr);}
  .benefit-grid{grid-template-columns:1fr;}
}
@media (max-width:720px){
  nav.links{display:none;}
  .nav-actions{display:none;}
  .menu-toggle{display:inline-flex;margin-left:auto;}
  .hero-search{flex-direction:column;}
  .hero-search .field+.field{border-left:none;border-top:1px solid var(--line);}
  .doctor-card{grid-template-columns:44px 1fr;}
  .doc-side{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;text-align:left;margin-top:6px;}
  .avatar{width:44px;height:44px;font-size:0.86rem;}
  .cta-panel{flex-direction:column;align-items:flex-start;}
  footer .footer-inner{flex-direction:column;align-items:flex-start;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>

function wireSearchView(){
 var chipRow=document.getElementById('chipRow'), listEl=document.getElementById('doctorList'),
     resultsMain=document.getElementById('resultsMain'),
     countEl=document.getElementById('resultsCount'), sortSelect=document.getElementById('sortSelect');
 var params=parseHash().params;
 var activeSpec=params.spec||'all', query=params.q||'';
 function matches(d,text){if(!text)return true;text=text.toLowerCase();return d.name.toLowerCase().indexOf(text)>-1||d.specialty.toLowerCase().indexOf(text)>-1||d.clinic.toLowerCase().indexOf(text)>-1;}
 function sortList(list){var mode=sortSelect.value,copy=list.slice();if(mode==='rating')copy.sort(function(a,b){return b.rating-a.rating;});else if(mode==='price_low')copy.sort(function(a,b){return a.price-b.price;});return copy;}
 function curatedRowHTML(title,list){if(!list.length)return '';return '<div class="curated-block"><h2 class="curated-title">'+title+'</h2><div class="curated-row">'+list.map(function(d){return doctorCardHTML(d);}).join('')+'</div></div>';}
 function render(){
   var curatedEl=document.getElementById('curatedWrap');
   var showCurated=(activeSpec==='all'&&!query);
   if(showCurated){
     var topRated=DOCTORS.slice().sort(function(a,b){return b.rating-a.rating;}).slice(0,3);
     var fastest=DOCTORS.slice().sort(function(a,b){return a.slotDays[0]-b.slotDays[0];}).slice(0,3);
     curatedEl.innerHTML=curatedRowHTML('Top-rated near you',topRated)+curatedRowHTML('Fastest available today',fastest);
   } else { curatedEl.innerHTML=''; }
   var filtered=DOCTORS.filter(function(d){return (activeSpec==='all'||d.specialty===activeSpec)&&matches(d,query);});
   filtered=sortList(filtered);
   countEl.textContent=filtered.length+(filtered.length===1?' result':' results');
   listEl.innerHTML=filtered.map(function(d){return doctorCardHTML(d);}).join('') || '<p style="color:var(--ink-soft);padding:20px 0;">No doctors match that search yet.</p>';
 }
 chipRow.addEventListener('click',function(e){var chip=e.target.closest('.chip');if(!chip)return;chipRow.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed','false');});chip.setAttribute('aria-pressed','true');activeSpec=chip.getAttribute('data-spec');render();});
 sortSelect.addEventListener('change',render);
 resultsMain.addEventListener('click',function(e){
   var card=e.target.closest('.doctor-card'); if(!card)return;
   var toggle=e.target.closest('.book-toggle');
   if(toggle){var panel=card.querySelector('.book-panel');var open=panel.classList.contains('open');document.querySelectorAll('.book-panel.open').forEach(function(p){p.classList.remove('open');});if(!open)panel.classList.add('open');return;}
   var pill=e.target.closest('.date-pill');
   if(pill){var grp=pill.parentElement;grp.querySelectorAll('.date-pill').forEach(function(p){p.setAttribute('aria-pressed','false');});pill.setAttribute('aria-pressed','true');return;}
   var slot=e.target.closest('.slot-btn');
   if(slot){var grid=slot.parentElement;grid.querySelectorAll('.slot-btn').forEach(function(s){s.setAttribute('aria-pressed','false');});slot.setAttribute('aria-pressed','true');
     var status=card.querySelector('.book-status'),cbtn=card.querySelector('.confirm-btn');cbtn.disabled=false;status.textContent='Selected '+slot.getAttribute('data-time')+' — confirm to book';status.classList.remove('confirmed');return;}
   var confirm=e.target.closest('.confirm-btn');
   if(confirm){var status2=card.querySelector('.book-status');status2.textContent='Appointment confirmed — reminder sent by SMS';status2.classList.add('confirmed');confirm.disabled=true;confirm.textContent='Booked';}
 });
 render();
}

/* ------------- Router ------------- */
function parseHash(){
 var hash=location.hash.replace(/^#/,'')||'/';
 var qIdx=hash.indexOf('?');
 var path=qIdx>-1?hash.slice(0,qIdx):hash;
 var qs=qIdx>-1?hash.slice(qIdx+1):'';
 var params={};
 qs.split('&').forEach(function(pair){if(!pair)return;var kv=pair.split('=');params[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||'');});
 return {path:path,params:params};
}
function navigate(path){location.hash=path;}
function setActiveNav(path){
 document.querySelectorAll('nav.links a').forEach(function(a){a.classList.toggle('active',a.getAttribute('data-route')===path);});
}
function render(){
 var r=parseHash(), app=document.getElementById('app');
 setActiveNav(r.path);
 window.scrollTo(0,0);
 if(r.path==='/'||r.path===''){app.innerHTML=landingView();}
 else if(r.path==='/search'){app.innerHTML=searchView(r.params);wireSearchView();}
 else if(r.path==='/doctor'){app.innerHTML=doctorView(r.params);wireDoctorView();}
 else if(r.path==='/signup'){app.innerHTML=authView('signup');wireAuthView();}
 else if(r.path==='/login'){app.innerHTML=authView('login');wireAuthView();}
 else if(r.path==='/clinics'){app.innerHTML=clinicsView();}
 else{app.innerHTML=notFoundView();}
}
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-route]');
 if(el){e.preventDefault();var mm=document.getElementById('mobileMenu');if(mm)mm.classList.remove('open');navigate(el.getAttribute('data-route'));return;}
 var specEl=e.target.closest('[data-goto-spec]');
 if(specEl){navigate('/search?spec='+encodeURIComponent(specEl.getAttribute('data-goto-spec')));return;}
 var qEl=e.target.closest('[data-goto-q]');
 if(qEl){navigate('/search?q='+encodeURIComponent(qEl.getAttribute('data-goto-q')));return;}
 if(e.target.id==='landingSearchBtn'){
   var q=document.getElementById('landingSymptom').value;
   navigate('/search'+(q?('?q='+encodeURIComponent(q)):''));
 }
});
document.getElementById('menuToggle').addEventListener('click',function(){document.getElementById('mobileMenu').classList.toggle('open');});
window.addEventListener('hashchange',render);
render();
})();
